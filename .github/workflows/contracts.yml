name: Portable Contracts

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel, not the checkout
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Verify release tag matches installed version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import importlib.metadata, os; assert os.environ['GITHUB_REF_NAME'] == 'v' + importlib.metadata.version('pvsyst-cli-mcp'), 'Tag and package version differ'"
      - name: Portable public contracts (zero skips)
        run: python scripts/check_contracts.py --report dist/contracts.json
      - name: Existing regression family for the stale CLI test adapters
        env:
          PYTHONPATH: tests
        run: >-
          python -m unittest
          test_design_flow.DesignFlowTests
          test_standard_template.StandardTemplateTests
          test_bugfix_workflows.SimulationTerminalStateTests
          test_bugfix_workflows.RevisionTerminalStateTests
          test_bugfix_project.ExplicitCountLineTests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: offline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages-ubuntu-latest-3.12
          path: dist
      - name: Publish tested distributions as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --verify-tag --draft --generate-notes
