[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvsyst-cli-mcp"
version = "0.5.0"
description = "Workspace-scoped MCP server and Python engineering adapter for installed PVsyst 8 software (PV/BESS sizing, TOU & two-part demand economics, zero-template components, 3D shading, and Plotly reports)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["pvsyst", "solar", "photovoltaic", "bess", "energy-storage", "mcp", "simulation", "renewable-energy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "plotly>=5.18,<7.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
pvsyst-mcp = "pvsyst_auto.api.app:main"

[project.urls]
Homepage = "https://github.com/Anonymousnake/pvsyst-cli-mcp"
Repository = "https://github.com/Anonymousnake/pvsyst-cli-mcp"
Issues = "https://github.com/Anonymousnake/pvsyst-cli-mcp/issues"
Releases = "https://github.com/Anonymousnake/pvsyst-cli-mcp/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pvsyst_auto*"]
